<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GymTwin</title>
<style>
  html,body{margin:0;height:100%;background:#070d1a;color:#e2e8f0;
    font-family:-apple-system,'Helvetica Neue',sans-serif;display:flex;
    align-items:center;justify-content:center;text-align:center}
  .wrap{padding:32px}
  h1{font-size:22px;font-weight:900;color:#fff;margin:16px 0 8px}
  p{font-size:14px;line-height:1.6;color:#94a3b8;margin:0 0 20px}
  button{background:linear-gradient(90deg,#2563eb,#9333ea);color:#fff;border:0;
    border-radius:16px;padding:14px 28px;font-size:14px;font-weight:800}
</style>
</head>
<body>
  <div class="wrap">
    <div style="font-size:40px">📶</div>
    <h1>You're offline</h1>
    <p>GymTwin needs a connection to load your coach.<br/>Check your network and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
